name: Documentation and firmware sanity check

on:
  push:
  pull_request:
  schedule:
    - cron: "30 16 * * 0"

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check expected project files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s cloud_bot-prototype-plan.md
          test -s firmware/cloud_bot_existing_parts/cloud_bot_existing_parts.ino
          test -s firmware/cloud_bot_light_test/cloud_bot_light_test.ino
          if ! grep -Eq "未完成|待验证|待实测" README.md; then
            echo "::error file=README.md::README must retain an explicit unfinished or pending hardware validation status."
            exit 1
          fi
          grep -q "12V" light-test-wiring.md
